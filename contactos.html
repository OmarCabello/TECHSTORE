
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contactos | TECHSTORE</title>

  <link rel="icon" href="assets/logo-gorilla - copia.webp" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <div id="site-header"></div>

  <main class="page">
    <div class="container contact-wrap">

      <div>
        <h2>Contactos</h2>

        <p class="section-lead">
          Estamos en Pasco, Perú. Escríbenos y te respondemos las 24 horas.
        </p>

        <ul class="contact-list">
          <li><strong>Teléfono:</strong> 964754544</li>
          <li><strong>Ubicación:</strong> Pasco-perú</li>
          <li><strong>Horario:</strong> Soporte 24/7</li>
        </ul>
      </div>

      <!-- FORMULARIO DE CONTACTO -->
      <form class="contact-form" id="contact-form">

        <label for="contact-name">Nombre</label>
        <input
          type="text"
          id="contact-name"
          name="nombre"
          placeholder="Escribe tu nombre"
          maxlength="100"
          required
        />

        <label for="contact-email">Correo</label>
        <input
          type="email"
          id="contact-email"
          name="correo"
          placeholder="ejemplo@gmail.com"
          maxlength="150"
          required
        />

        <label for="contact-message">Mensaje</label>
        <textarea
          id="contact-message"
          name="mensaje"
          rows="4"
          maxlength="5000"
          placeholder="Escribe tu mensaje..."
          required
        ></textarea>

        <button type="submit" class="btn-buy">
          Enviar mensaje
        </button>

        <p class="form-ok" id="contact-ok" hidden></p>

      </form>

    </div>
  </main>

  <div id="site-footer"></div>
  <div id="site-drawers"></div>

  <!-- Cargar los archivos una sola vez -->
  <script src="js/main.js"></script>
  <script type="module" src="js/supabase.js"></script>
  <script src="js/main.js"></script>
  <script type="module" src="js/supabase.js"></script>
</body>
</html>
