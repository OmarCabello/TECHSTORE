
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | TECHSTORE</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="page admin-panel">
        <div class="container">

            <div class="admin-heading">
                <div>
                    <h1>Panel de administración</h1>
                    <p>Bienvenido a TECHSTORE</p>
                </div>

                <button id="logout-btn" class="btn-logout">
                    Cerrar sesión
                </button>
            </div>

            <h2>Mensajes recibidos</h2>
            <p>Registro de mensajes enviados por nuestros clientes.</p>

            <p id="admin-status">Cargando mensajes...</p>

            <div class="table-container">
                <table class="messages-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Mensaje</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>

                    <tbody id="messages-body"></tbody>
                </table>
            </div>

        </div>
    </main>

    <script type="module" src="js/admin.js"></script>
    <script type="module" src="js/admin.js"></script>

</body>
</html>
